<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sai’s To-Do-List</title>
    <!-- Import High-End Premium Web Fonts -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@800;900&display=swap" rel="stylesheet">
    
    <style>
        * { 
            box-sizing: border-box; 
            font-family: 'Inter', system-ui, -apple-system, sans-serif; 
        }
        body { 
            background-color: #0b192c; /* Rich Deep Midnight Blue */
            display: flex; 
            justify-content: center; 
            align-items: flex-start; 
            min-height: 100vh; 
            margin: 0; 
            padding: 50px 24px; 
        }
        .todo-container { 
            background: #1e3a8a; /* Solid Navy Core */
            width: 100%; 
            max-width: 850px; /* Highly expanded premium layout size */
            padding: 45px; 
            border-radius: 20px; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.6); 
            border: 4px solid #facc15; /* Ultra Bold Gold Outline */
        }
        h1 { 
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            color: #facc15; 
            margin-top: 0; 
            text-align: center; 
            font-size: 46px; /* High visibility main header banner */
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 35px;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.5);
        }
        .section-title {
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
            color: #facc15;
            font-size: 22px; /* Bigger block subheadings */
            margin: 40px 0 15px 0;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-bottom: 3px solid rgba(250, 204, 21, 0.4);
            padding-bottom: 8px;
        }
        .input-section { 
            display: flex; 
            gap: 15px; 
            margin-bottom: 15px; 
        }
        input[type="text"] { 
            flex: 1; 
            padding: 20px; /* Massive clear typing boxes */
            border: 3px solid #3b82f6; 
            background-color: #0f172a;
            color: #ffffff;
            border-radius: 12px; 
            font-size: 18px; 
            font-weight: 500;
            outline: none; 
            transition: all 0.2s ease-in-out; 
        }
        input[type="text"]::placeholder {
            color: #64748b;
        }
        input[type="text"]:focus { 
            border-color: #facc15; 
            box-shadow: 0 0 15px rgba(250, 204, 21, 0.4);
        }
        .add-btn { 
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            background-color: #facc15; 
            color: #0b192c; 
            border: none; 
            padding: 20px 40px; 
            border-radius: 12px; 
            font-size: 18px; 
            cursor: pointer; 
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: background-color 0.2s;
        }
        .add-btn:hover { 
            background-color: #eab308; 
        }
        ul { 
            list-style: none; 
            padding: 0; 
            margin: 0; 
        }
        li { 
            display: flex; 
            align-items: center; 
            padding: 22px; /* Tall list panels */
            background: #0f172a; 
            color: #ffffff;
            margin-bottom: 14px; 
            border-radius: 12px; 
            border-left: 8px solid #facc15; /* Heavy styling accents */
            font-size: 19px; 
            font-weight: 600;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
        }
        li.fade-out {
            opacity: 0;
            transform: translateX(60px); 
        }
        .custom-checkbox {
            width: 30px; /* Oversized easy-click checkboxes */
            height: 30px;
            border: 3px solid #facc15;
            border-radius: 50%;
            margin-right: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .custom-checkbox:hover {
            background-color: rgba(250, 204, 21, 0.25);
        }
        .custom-checkbox::after {
            content: '✓';
            color: #0b192c;
            font-weight: 900;
            font-size: 18px;
            display: none;
        }
        .custom-checkbox.checked {
            background-color: #facc15;
        }
        .custom-checkbox.checked::after {
            display: block;
        }
        .task-text { 
            flex: 1; 
            word-break: break-all;
            line-height: 1.5;
        }
        /* Archive Tracker Configurations */
        .completed-list li {
            border-left: 8px solid #475569;
            background: rgba(15, 23, 42, 0.55);
            color: #94a3b8;
            opacity: 0.6;
        }
        .completed-list .task-text {
            text-decoration: line-through;
        }
        .action-tray {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }
        .control-btn {
            font-family: 'Inter', sans-serif;
            font-weight: 600;
            background: transparent;
            color: #94a3b8;
            border: 2px dashed #475569;
            padding: 12px 24px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 15px;
            transition: all 0.2s;
        }
        .control-btn:hover {
            color: #ef4444;
            border-color: #ef4444;
            background: rgba(239, 68, 68, 0.08);
        }
        /* Top Cinematic Notice Windows */
        .toast-notification {
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
            position: fixed;
            top: 40px;
            left: 50%;
            transform: translate(-50%, -120px);
            background-color: #facc15;
            color: #0b192c;
            padding: 20px 45px;
            border-radius: 40px;
            font-size: 18px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 999;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }
        .toast-notification.show {
            transform: translate(-50%, 0);
            opacity: 1;
        }
    </style>
</head>
<body>

<div class="todo-container">
    <h1>Sai’s To-Do-List</h1>
    
    <div class="input-section">
        <input type="text" id="taskInput" placeholder="Enter task items here..." autocomplete="off">
        <button class="add-btn" onclick="addTask()">Add Task</button>
    </div>

    <div class="section-title">Active Items</div>
    <ul id="taskList"></ul>

    <div class="section-title">Completed Log</div>
    <ul id="completedList" class="completed-list"></ul>
    
    <div class="action-tray">
        <button id="clearHistory" class="control-btn" onclick="clearHistory()" style="display:none;">Clear History Log</button>
    </div>
</div>

<div id="toast" class="toast-notification">Task Completed!</div>

<script>
    const taskInput = document.getElementById('taskInput');
    const taskList = document.getElementById('taskList');
    const completedList = document.getElementById('completedList');
    const clearHistoryBtn = document.getElementById('clearHistory');
    const toast = document.getElementById('toast');

    let activeTasks = JSON.parse(localStorage.getItem('sai_active')) || [];
    let archiveTasks = JSON.parse(localStorage.getItem('sai_archive')) || [];

    activeTasks.forEach(text => renderActiveTask(text));
    archiveTasks.forEach(text => renderArchiveTask(text));
    toggleHistoryButton();

    function addTask() {
        const text = taskInput.value.trim();
        if (text === '') return;
        renderActiveTask(text);
        saveAll();
        taskInput.value = '';
    }

    function renderActiveTask(text) {
        const li = document.createElement('li');
        const checkbox = document.createElement('div');
        checkbox.className = 'custom-checkbox';
        
        const span = document.createElement('span');
        span.className = 'task-text';
        span.textContent = text;

        checkbox.onclick = () => {
            checkbox.classList.add('checked');
            showNotification();
            
            setTimeout(() => {
                li.classList.add('fade-out');
                setTimeout(() => {
                    li.remove();
                    renderArchiveTask(text);
                    saveAll();
                }, 300);
            }, 200);
        };

        li.appendChild(checkbox);
        li.appendChild(span);
        taskList.appendChild(li);
    }

    function renderArchiveTask(text) {
        const li = document.createElement('li');
        const checkbox = document.createElement('div');
        checkbox.className = 'custom-checkbox checked'; 
        
        const span = document.createElement('span');
        span.className = 'task-text';
        span.textContent = text;

        li.appendChild(checkbox);
        li.appendChild(span);
        completedList.appendChild(li);
        toggleHistoryButton();
    }

    function showNotification() {
        toast.classList.add('show');
        setTimeout(() => {
            toast.classList.remove('show');
        }, 2000);
    }

    function clearHistory() {
        completedList.innerHTML = '';
